name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libblas-dev liblapack-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang libomp-dev
          fi

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            CC=clang; CXX=clang++
          else
            CC=gcc; CXX=g++
          fi
          cmake -B build \
            -DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX \
            -DUSE_OPENMP=ON -DUSE_CUDA=OFF -DUSE_BLAS=ON -DUSE_LAPACK=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-run an example
        run: ./build/examples/01_load_query data/tensors/3d_7.tns
